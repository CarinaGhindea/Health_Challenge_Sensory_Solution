<html> 
    <head> 
        <meta charset="UTF-8">
        <title>Comfort Dashboard</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="icon" href="data:,">
        <link rel="stylesheet" type="text/css" href="dashboard.css">
    </head>
    <body>
        <div class="overall-comfort">
            <h1>Comfort Dashboard: </h1>
            <span id="overall-comfort-text"></span>
        </div>

        <div class="recommendation">
            <h2>Recommendation: </h2>
            <span id="recommendation-text"></span>
        </div>

        <div class="comfort-breakdown-section">
            <h2>Comfort Breakdown</h2>
            <div class="comfort-breakdown-container">
                <div class="breakdown-card" id="comfort-breakdown-card">
                    <h3>Comfort</h3>
                    <span id="comfort-breakdown-text"></span>
                </div>
                <div class="breakdown-card" id="light-breakdown-card">
                    <h3>Light</h3>
                    <span id="light-breakdown-text"></span>
                </div>
                <div class="breakdown-card" id="sound-breakdown-card">
                    <h3>Sound</h3>
                    <span id="sound-breakdown-text"></span>
                </div>
                <div class="breakdown-card" id="temperature-breakdown-card">
                    <h3>
                    <span class="desktop-label">Temperature</span>
                    <span class="mobile-label">Temp</span>
                    </h3>
                    <span id="temperature-breakdown-text"></span>
                </div>
            </div>
        </div>

        <div class="sensor-info-container">
            <div class="sensor-info-card" id="light-info-card">
            <h2> Light </h2>
            <span id="light-level"></span>
            <span id="light-trend"></span>
            <span id="light-spike"></span>
            </div>

            <div class="sensor-info-card" id="sound-info-card">
            <h2> Sound </h2>
            <span id="sound-level"></span>
            <span id="sound-trend"></span>
            <span id="sound-spike"></span>
            </div>

            <div class="sensor-info-card" id="temperature-info-card">
            <h2> Temperature </h2>
            <span id="temperature-current"></span>
            <span id="temperature-level"></span>
            <span id="temperature-trend"></span>
            <span id="temperature-spike"></span>
            </div>
        </div>

        <script src="dashboard.js"></script>
    </body>
</html>
