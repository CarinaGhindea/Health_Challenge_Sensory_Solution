<html> 
    <head> 
        <meta charset="UTF-8">
        <title>Overall Comfort Dashboard</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="icon" href="data:,">
        <link rel="stylesheet" type="text/css" href="style.css">
    </head>
    <body>
        <h2>Recommendation: </h2>
        <p> 
            <span class="recommendation">recommendation</span>
            <span id="recommendation-text"></span>
        </p>
        <h2>Comfort Breakdown</h2>
        <p> 
            <span class="comfort-breakdown">Comfort: <br> </span>
            <span id="comfort-breakdown-text"></span>
            <span class="comfort-breakdown">Light:<br> </span>
            <span id="light-breakdown-text"></span>
            <span class="comfort-breakdown">Sound: <br> </span>
            <span id="sound-breakdown-text"></span>
            <span class="comfort-breakdown">Temperature: </span>
            <span id="temperature-breakdown-text"></span>
        </p>
        <h2> Light </h2>
        <p>
            <span class="light-info">Light</span><br>
            <span id="light-level">Level</span><br>
            <span id="light-trend">Trend</span><br>
            <span id="light-spike">Spike</span>

        </p>
        <h2> Sound </h2>
        <p>
            <span class="sound-info">Sound</span><br>
            <span id="sound-level">Level</span><br>
            <span id="sound-trend">Trend</span><br>
            <span id="sound-spike">Spike</span>
        </p>
        <h2> Temperature </h2>
        <p>
            <span class="temperature-info"></span><br>
            <span id="temperature-current">Current Temperature</span><br>
            <span id="temperature-level">Level</span><br>
            <span id="temperature-trend">Trend</span><br>
            <span id="temperature-spike">Spike</span>
        </p>
    </body>
</html>
